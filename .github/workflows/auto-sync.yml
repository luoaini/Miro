name: auto-sync-fish

on:
  schedule:
    - cron: '0,30 * * * *'
  workflow_dispatch:

concurrency:
  group: auto-sync-fish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard logo.jpg
        run: |
          test -f logo.jpg || { echo "logo.jpg 缺失，终止以防头像消失"; exit 1; }
          ls -l logo.jpg

      - name: Fetch and update fish.json
        id: sync
        run: |
          python3 scripts/sync_fish.py
          if [ -n "$(git status --porcelain fish.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push (GitHub)
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add fish.json
          git commit -m "auto sync fish.json $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push origin HEAD:main

      - name: Push to GitLink (force)
        if: steps.sync.outputs.changed == 'true'
        env:
          GITLINK_TOKEN: ${{ secrets.GITLINK_TOKEN }}
        run: |
          git remote add gitlink "https://oauth2:${GITLINK_TOKEN}@www.gitlink.org.cn/Miro/Miro.git"
          git push --force gitlink HEAD:master

      - name: Verify CDN
        if: steps.sync.outputs.changed == 'true'
        run: |
          for u in "https://cdn09022024.gitlink.org.cn/api/v1/repos/Miro/Miro/raw/fish.json?ref=master" \
                   "https://cdn09022024.gitlink.org.cn/api/v1/repos/Miro/Miro/raw/logo.jpg?ref=master"; do
            echo -n "$u -> "; curl -s -o /dev/null -w "%{http_code}\n" "$u"
          done
